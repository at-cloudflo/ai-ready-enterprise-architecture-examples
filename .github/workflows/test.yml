name: ForgeWorks test suite
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the tests (warnings are errors)
        run: python -X dev -W error -m unittest discover -s tests -v
      - name: Run the end-to-end demo
        run: python -X dev -W error -m forgeworks.demo
      - name: Check each released part's script against its expected output
        run: python -X dev -W error -m series --check
      - name: Run the traversal harness (correctness gate only)
        run: python -m scripts.traversal_benchmark --layers 5 --width 100 --starts 5 --repeats 2
